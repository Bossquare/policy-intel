<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="建筑智能化政策与技术情报站">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a4a7f"/>
      <stop offset=".55" stop-color="#123a63"/>
      <stop offset="1" stop-color="#0f2c4d"/>
    </linearGradient>
    <linearGradient id="sig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3b8ef0"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- 徽标底 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.2" y="1.2" width="61.6" height="61.6" rx="13" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.2"/>

  <!-- 情报信号：同心弧（自右上角向左下扫描） -->
  <g fill="none" stroke="url(#sig)" stroke-width="2.6" stroke-linecap="round">
    <path d="M52 22.5 A8.5 8.5 0 0 0 43.5 14"/>
    <path d="M52 30.5 A16.5 16.5 0 0 0 35.5 14" opacity=".62"/>
    <path d="M52 38.5 A24.5 24.5 0 0 0 27.5 14" opacity=".34"/>
  </g>
  <circle cx="52" cy="14" r="3.1" fill="#f0b429"/>
  <circle cx="52" cy="14" r="1.3" fill="#fff"/>

  <!-- 建筑群 -->
  <g>
    <rect x="13" y="29" width="9.5" height="21" rx="1.6" fill="#5b9bd5"/>
    <rect x="25.5" y="21" width="10.5" height="29" rx="1.6" fill="#9cc3ec"/>
    <rect x="39" y="33" width="8.5" height="17" rx="1.6" fill="#3f7fc0"/>

    <!-- 窗格：数字化网格 -->
    <g fill="#0f2c4d" opacity=".5">
      <rect x="15.6" y="33" width="2.3" height="2.3" rx=".5"/>
      <rect x="18.9" y="33" width="2.3" height="2.3" rx=".5"/>
      <rect x="15.6" y="37.4" width="2.3" height="2.3" rx=".5"/>
      <rect x="18.9" y="37.4" width="2.3" height="2.3" rx=".5"/>
      <rect x="15.6" y="41.8" width="2.3" height="2.3" rx=".5"/>
      <rect x="18.9" y="41.8" width="2.3" height="2.3" rx=".5"/>

      <rect x="28.2" y="25" width="2.4" height="2.4" rx=".5"/>
      <rect x="31.8" y="25" width="2.4" height="2.4" rx=".5"/>
      <rect x="28.2" y="29.6" width="2.4" height="2.4" rx=".5"/>
      <rect x="31.8" y="29.6" width="2.4" height="2.4" rx=".5"/>
      <rect x="28.2" y="34.2" width="2.4" height="2.4" rx=".5"/>
      <rect x="31.8" y="34.2" width="2.4" height="2.4" rx=".5"/>
      <rect x="28.2" y="38.8" width="2.4" height="2.4" rx=".5"/>
      <rect x="31.8" y="38.8" width="2.4" height="2.4" rx=".5"/>

      <rect x="41.4" y="37" width="2.2" height="2.2" rx=".5"/>
      <rect x="44.4" y="37" width="2.2" height="2.2" rx=".5"/>
      <rect x="41.4" y="41" width="2.2" height="2.2" rx=".5"/>
      <rect x="44.4" y="41" width="2.2" height="2.2" rx=".5"/>
    </g>

    <!-- 最高楼的信号窗（亮） -->
    <rect x="31.8" y="25" width="2.4" height="2.4" rx=".5" fill="#f0b429" opacity=".95"/>
  </g>

  <!-- 基线 -->
  <rect x="10" y="50" width="41" height="2.6" rx="1.3" fill="#8fbde8" opacity=".55"/>
</svg>
