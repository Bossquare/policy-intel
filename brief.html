<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情报简报 · 建筑智能化政策与技术情报站</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f2c4d'/%3E%3Crect x='14' y='16' width='36' height='6' rx='3' fill='%231e6fd9'/%3E%3Crect x='14' y='28' width='24' height='6' rx='3' fill='%235b9bd5'/%3E%3Crect x='14' y='40' width='30' height='6' rx='3' fill='%230e7490'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="brief">

<nav class="nav">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="logo">情</span>建筑智能化情报站</a>
    <a class="link" href="index.html">情报看板</a>
    <a class="link" href="items.html">条目库</a>
    <a class="link on" href="briefs.html">简报归档</a>
    <a class="link" href="agent.html">智能体</a>
    <a class="gh" href="https://github.com/Bossquare/policy-intel" target="_blank" rel="noopener">GitHub</a>
  </div>
</nav>

<header class="hero" style="padding:32px 0 44px">
  <div class="wrap">
    <span class="tag">POLICY INTELLIGENCE BRIEF</span>
    <h1 id="brief-title" style="font-size:26px">情报简报</h1>
    <p class="sub" style="font-size:15px" id="brief-sub"></p>
    <div class="meta" id="brief-meta"></div>
  </div>
</header>

<main class="wrap">
  <div id="brief" class="detail"><div class="loading">加载中…</div></div>
  <div style="margin-top:22px">
    <button class="btn ghost" onclick="window.print()">打印 / 导出 PDF</button>
    <a class="btn ghost" href="briefs.html">← 返回归档列表</a>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <div><b>建筑智能化政策与技术情报站</b>　·　本页内容按期冻结，历史可追溯</div>
    <div>正式决策请以官方原文为准</div>
  </div>
</footer>

<script src="assets/data/site-data.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  var S = window.INTEL_SITE; if(!S) return;
  var id = new URLSearchParams(location.search).get("id") || S.index.briefs[0].id;
  var b = S.briefs[id]; if(!b) return;
  var t = document.getElementById("brief-title"), s = document.getElementById("brief-sub"), m = document.getElementById("brief-meta");
  if(t) t.textContent = b.meta.title;
  if(s) s.textContent = "时间窗口 " + b.meta.period + "　|　收录 " + b.meta.total + " 条（去重后）";
  if(m) m.innerHTML =
      "<span><b>生成日期</b>　" + b.meta.generated_at + "</span>" +
      "<span><b>影响分析</b>　" + (b.meta.insight_count || 0) + " 条</span>" +
      "<span><b>档级分布</b>　重点 " + (b.stats.by_tier.focus||0) + " / 跟踪 " + (b.stats.by_tier.track||0) + " / 了解 " + (b.stats.by_tier.watch||0) + "</span>";
})();
</script>
</body>
</html>
